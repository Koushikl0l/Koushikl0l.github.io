# Build and deploy this Vite app to GitHub Pages (replaces previous site)
#
# Required: In repo Settings → Pages, set "Build and deployment" → Source to
# "GitHub Actions". If you use "Deploy from a branch", the site will show a
# white page because the repo only has source files, not the built assets.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Project site: yourname.github.io/REPO_NAME → base = /REPO_NAME/
          # User/org site: yourname.github.io → base = /
          VITE_BASE_PATH: ${{ github.event.repository.name }}
        run: npm run build

      - name: Fix SPA routing (404 → index.html)
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
